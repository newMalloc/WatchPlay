<!doctype html>
<html lang="en" data-screen-shape="round">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WatchPlay demo scene</title>
<style>
/*
  A deliberately simple watch-face scene that proves the contract of docs/spec/06-rendering.md:
   * every size is relative (vmin / %), never an absolute pixel;
   * the margin comes from var(--wp-safe-inset), which the phone injects verbatim;
   * one document serves round and square panels through html[data-screen-shape];
   * the background is opaque, because JPEG has no alpha channel and transparency encodes as black;
   * nothing is animated faster than 100 ms, because the capture cadence is about 10 fps.
*/
:root{
  --wp-safe-inset:14vmin;              /* fallback; the phone overrides it from CAPS.safe_inset_permille */
  --wp-bg:#05070c; --wp-fg:#eef3ff; --wp-dim:#8a93a8; --wp-accent:#4ac6ff;
  --wp-phase:0;
}
html[data-screen-shape="square"]{ --wp-safe-inset:4vmin; }

*{ box-sizing:border-box; margin:0; padding:0; }
html,body{
  width:100%; height:100%; overflow:hidden; overscroll-behavior:none; touch-action:none;
  background:var(--wp-bg); color:var(--wp-fg);
  font-family:system-ui,"Roboto","Noto Sans CJK SC","Source Han Sans SC",sans-serif;
  font-variant-numeric:tabular-nums;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
/* The animated background: only `filter` and `transform`-free gradient stops change, so no relayout. */
.aurora{
  position:absolute; inset:0;
  background:
    radial-gradient(circle at calc(50% + var(--wp-phase) * 20%) 30%, #12305a 0%, #05070c 60%),
    radial-gradient(circle at 30% calc(50% + var(--wp-phase) * 25%), #1d2740 0%, #05070c 65%);
  transition:background 300ms linear;
}
.safe{
  position:relative; height:100%; padding:var(--wp-safe-inset);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1vmin;
}
.clock{ font-size:12.3vmin; font-weight:600; line-height:1.1; }
.label{ font-size:4.3vmin; color:var(--wp-dim); }
.dot{
  width:3vmin; height:3vmin; border-radius:50%; background:var(--wp-accent);
  opacity:calc(0.35 + var(--wp-phase) * 0.65); transition:opacity 300ms linear;
}
.hint{ font-size:4.3vmin; color:var(--wp-accent); }
</style>
</head>
<body>
  <div class="aurora" id="aurora"></div>
  <main class="safe">
    <div class="dot" id="dot"></div>
    <div class="clock" id="clock">09:41</div>
    <div class="label">WatchPlay demo scene</div>
    <div class="hint" id="hint">Tap the watch face</div>
  </main>
<script>
  // The scene exposes only side-effect-free setters. It never drives its own timing, so a captured frame
  // always matches the phase the phone asked for (docs/spec/06-rendering.md section 3.7).
  window.watchplay = window.watchplay || {};
  window.watchplay.data = window.watchplay.data || {};

  window.watchplay.setPhase = function (value) {
    var p = Math.max(0, Math.min(1, Number(value) || 0));
    document.documentElement.style.setProperty('--wp-phase', String(p));
  };
  window.watchplay.setClock = function (text) {
    document.getElementById('clock').textContent = text;
  };
  window.watchplay.setHint = function (text) {
    document.getElementById('hint').textContent = text;
  };
  window.watchplay.render = function () {
    var d = window.watchplay.data || {};
    if (d.phase !== undefined) window.watchplay.setPhase(d.phase);
    if (d.clock !== undefined) window.watchplay.setClock(d.clock);
    if (d.hint !== undefined) window.watchplay.setHint(d.hint);
  };

  // Local preview: when the page is opened without the SDK driving it, animate it here so the demo is
  // visibly alive. The phone overrides the phase per frame once mirroring starts.
  (function localPreview() {
    var start = performance.now();
    function step(now) {
      var p = ((now - start) % 3000) / 3000;
      window.watchplay.setPhase(p);
      var d = new Date();
      window.watchplay.setClock(
        String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0')
      );
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
</script>
</body>
</html>
