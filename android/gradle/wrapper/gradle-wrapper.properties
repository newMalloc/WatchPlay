# WatchPlay — Android phone side: Gradle wrapper pin.
#
# 9.3.1 is chosen because (a) it is the newest Gradle line that the cached AGP 9.1.0 supports and
# (b) its distribution is already present on this machine at
# %USERPROFILE%\.gradle\wrapper\dists\gradle-9.3.1-bin, so `gradlew` works with no download.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
