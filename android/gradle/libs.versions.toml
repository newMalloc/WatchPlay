# WatchPlay — Android phone side: Gradle version catalog.
#
# Version selection policy:
#   * Use the newest AGP already present in ~/.gradle/caches/modules-2. That is AGP 9.1.0, so the phone
#     modules build without downloading a build plugin.
#   * Gradle is pinned to 9.3.1, whose distribution is already unpacked in
#     %USERPROFILE%\.gradle\wrapper\dists\gradle-9.3.1-bin.
#   * Kotlin is compiled by AGP 9's **built-in Kotlin support** (android.builtInKotlin, default true).
#     The standalone org.jetbrains.kotlin.android plugin is not compatible with AGP 9.1 — it fails with
#     "cannot be cast to com.android.build.gradle.BaseExtension" — so no Kotlin plugin id is declared
#     here. kotlin-stdlib is an ordinary dependency and is pinned below.
#   * androidx.* and JUnit are ordinary Maven dependencies resolved from google()/mavenCentral(); they
#     are cached after the first successful build.

[versions]
# Build plugins.
agp = "9.1.0"

# Kotlin standard library used by the SDK and the demo.
kotlin = "2.2.10"

# Runtime dependencies.
coreKtx = "1.13.1"
appcompat = "1.7.0"

# Test dependencies.
junit = "4.13.2"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
