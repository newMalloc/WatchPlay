# WatchPlay — Android phone side (Gradle properties).
#
# Deliberately conservative: only flags that are stable across AGP 8.x and 9.x, plus an
# offline-friendly Gradle configuration. Do NOT add `org.gradle.java.home` here — it is
# machine-specific; set JAVA_HOME (or let Android Studio supply its bundled JBR) instead.

# --- Gradle build behaviour ---------------------------------------------------------------
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# The Android/Kotlin plugin pair is re-resolved on every configuration; the configuration cache
# is intentionally left off so that `gradlew :sdk:assembleDebug` works on the first try for new
# contributors and on CI images with a partially warm cache.
org.gradle.configuration-cache=false
# Fail fast instead of hanging when a repository is unreachable.
org.gradle.internal.repository.max.tentatives=1
org.gradle.internal.repository.initial.backoff=100

# --- AndroidX / AGP -----------------------------------------------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true

# --- Kotlin -------------------------------------------------------------------------------
kotlin.code.style=official
