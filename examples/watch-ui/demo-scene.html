<!doctype html>
<html lang="zh-CN" data-screen-shape="round">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WatchPlay 手表场景（表盘 / 音乐 / 导航）</title>
<!--
  一个文档，三个场景：表盘、音乐播放、地图导航，任意点击互相切换。

  这个文件是**手机端要渲染并投屏给手表的那份 HTML**，所以它遵守 docs/spec/06-rendering.md：
    * 所有尺寸用 vmin / %，绝不用绝对像素（手表换屏不用改场景）；
    * 边距来自 var(--wp-safe-inset)，用 vmin；圆屏由手机注入 140‰，本文件给的 14vmin 只是兜底；
    * html[data-screen-shape] 同时服务圆屏与方屏，一个文档不写两遍；
    * 背景不透明——JPEG 没有 alpha，透明会被编成黑色；
    * 零外部请求：没有图片、字体、iframe、外链 CSS，图标全用 CSS 与内联 SVG；
    * 动效不短于 100 ms，因为捕获节奏约 10 fps。

  浏览器里直接打开即可点击；用 ?shape=square 切方屏、?inset=60 改安全区，
  只是为了预览方便——真机上这两个值由手机的 WebViewRenderModule 注入。
-->
<style>
:root{
  --wp-safe-inset:14vmin;
  --wp-bg:#05070c; --wp-fg:#eef3ff; --wp-dim:#8a93a8;
  --wp-accent:#4ac6ff; --wp-warm:#ffb35c; --wp-ok:#6ee7a8;
}
html[data-screen-shape="square"]{ --wp-safe-inset:4vmin; }

*{ box-sizing:border-box; margin:0; padding:0; }
html,body{
  width:100%; height:100%; overflow:hidden; background:var(--wp-bg); color:var(--wp-fg);
  font-family:system-ui,"Roboto","Noto Sans CJK SC","Source Han Sans SC",sans-serif;
  font-variant-numeric:tabular-nums;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent; touch-action:none;
  overscroll-behavior:none;
}

/* ---------------------------------------------------------------- 场景框架 */
.scene{
  position:absolute; inset:0; display:flex; flex-direction:column;
  opacity:0; pointer-events:none;
  transition:opacity .12s linear;              /* 10 fps 捕获下不会糊成一团 */
}
.scene[data-active="1"]{ opacity:1; pointer-events:auto; }

.bg{ position:absolute; inset:0; pointer-events:none; }

.overlay{
  position:relative; height:100%; width:100%;
  /* 底部多留 1.2vmin：圆屏的底边弧线比左右更"吃"内容，三键贴着 65 px 会显得快掉出去。 */
  padding:var(--wp-safe-inset) var(--wp-safe-inset) calc(var(--wp-safe-inset) + 1.2vmin);
  display:flex; flex-direction:column; align-items:center; justify-content:space-between;
  gap:1vmin;
}
/* 不许被 flex 压扁：圆形的封面一压就成了椭圆，这在 466px 的圆屏上很显眼。 */
.overlay > *{ flex:0 0 auto; }

/* ---------------------------------------------------------------- 底部三键 */
.tabs{ display:flex; gap:2vmin; align-items:center; justify-content:center; }
.btn-tab{
  width:19.4vmin; height:19.4vmin; border-radius:6vmin;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.4vmin;
  background:rgba(255,255,255,.055); border:.35vmin solid rgba(255,255,255,.10);
  color:var(--wp-dim); font-size:4.4vmin; font-family:inherit;
  transition:background .12s linear, color .12s linear, border-color .12s linear;
}
.btn-tab[data-current="1"]{
  color:var(--wp-fg); border-color:var(--wp-accent); background:rgba(74,198,255,.16);
}
.btn-tab .k{ font-size:4.4vmin; line-height:1; }

/* ---------------------------------------------------------------- 表盘 */
.bg-face{
  background:
    radial-gradient(circle at 50% 42%, rgba(74,198,255,.16), transparent 62%),
    radial-gradient(circle at 50% 100%, rgba(255,179,92,.10), transparent 55%);
}
.face-top{ display:flex; flex-direction:column; align-items:center; gap:.8vmin; }
.face-time{
  font-size:17vmin; line-height:1; font-weight:600; letter-spacing:-.02em;
  text-shadow:0 0 6vmin rgba(74,198,255,.28);
}
.face-date{ font-size:4.6vmin; color:var(--wp-dim); }
.face-row{ display:flex; gap:5vmin; align-items:center; }
.btn-quick{
  width:21vmin; height:21vmin; border-radius:50%;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.6vmin;
  background:rgba(255,255,255,.06); border:.4vmin solid rgba(255,255,255,.12);
  color:var(--wp-fg); font-size:4.6vmin; font-family:inherit;
}
.btn-quick .ico{ font-size:7vmin; line-height:1; color:var(--wp-accent); }
.btn-quick .lbl{ font-size:4.4vmin; color:var(--wp-dim); }
.btn-quick:active{ background:rgba(74,198,255,.22); }

/* ---------------------------------------------------------------- 音乐 */
.bg-music{
  background:
    radial-gradient(circle at 50% 32%, rgba(74,198,255,.24), transparent 58%),
    radial-gradient(circle at 50% 118%, rgba(255,179,92,.12), transparent 55%);
}
.cover{
  width:16vmin; height:16vmin; border-radius:50%;
  background:
    conic-gradient(from 0deg, #16233a 0 12%, #0d1522 12% 25%, #16233a 25% 37%, #0d1522 37% 50%,
                   #16233a 50% 62%, #0d1522 62% 75%, #16233a 75% 87%, #0d1522 87% 100%);
  border:.5vmin solid rgba(255,255,255,.10);
  display:flex; align-items:center; justify-content:center;
}
.cover i{
  width:7vmin; height:7vmin; border-radius:50%;
  background:var(--wp-accent); opacity:.85;
}
.track{ display:flex; flex-direction:column; align-items:center; gap:.5vmin; }
.track-title{ font-size:5.2vmin; font-weight:600; }
.track-artist{ font-size:4.4vmin; color:var(--wp-dim); }
.progress{
  width:64vmin; height:.9vmin; border-radius:1vmin; background:rgba(255,255,255,.12);
  overflow:hidden;
}
.progress i{ display:block; width:38%; height:100%; background:var(--wp-accent); }
.controls{ display:flex; gap:3vmin; align-items:center; }
.btn-ctl{
  width:19.4vmin; height:19.4vmin; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:rgba(255,255,255,.06); border:.35vmin solid rgba(255,255,255,.12);
  color:var(--wp-fg); font-size:5.6vmin; font-family:inherit;
}
.btn-ctl[data-primary="1"]{
  background:rgba(74,198,255,.20); border-color:var(--wp-accent); font-size:6.4vmin;
}
.btn-ctl:active{ background:rgba(74,198,255,.30); }

/* ---------------------------------------------------------------- 导航 */
.bg-map{ overflow:hidden; }
.grid{ position:absolute; inset:-10%;
  background-image:
    linear-gradient(rgba(122,152,196,.13) .4vmin, transparent .4vmin),
    linear-gradient(90deg, rgba(122,152,196,.13) .4vmin, transparent .4vmin);
  background-size:11vmin 11vmin;
}
.road{ position:absolute; left:-10%; right:-10%; top:58%; height:9vmin;
  background:rgba(255,255,255,.05); border-top:.4vmin solid rgba(255,255,255,.10);
  border-bottom:.4vmin solid rgba(255,255,255,.10); }
.map-route{ position:absolute; inset:0; width:100%; height:100%; }
/* 定位点单独放，不跟着 SVG 的 viewBox 缩放，也不会被任何遮罩淡掉。 */
.me{
  position:absolute; left:86%; top:58%; width:4.4vmin; height:4.4vmin;
  transform:translate(-50%,-50%); border-radius:50%;
  background:var(--wp-fg); border:.7vmin solid rgba(74,198,255,.85);
  box-shadow:0 0 4vmin rgba(74,198,255,.75);
}
.turn-card{
  display:flex; align-items:center; gap:3vmin;
  padding:2.4vmin 4vmin; border-radius:5vmin;
  background:rgba(6,10,18,.82); border:.35vmin solid rgba(74,198,255,.35);
}
.turn-arrow{
  width:12vmin; height:12vmin; border-radius:3vmin;
  background:rgba(74,198,255,.18);
  display:flex; align-items:center; justify-content:center;
  color:var(--wp-accent); font-size:8vmin; line-height:1;
}
.turn-text{ display:flex; flex-direction:column; gap:.4vmin; }
.turn-distance{ font-size:6.4vmin; font-weight:600; }
.turn-street{ font-size:4.6vmin; color:var(--wp-dim); }
.map-foot{ display:flex; align-items:center; gap:4vmin; font-size:4.6vmin; color:var(--wp-dim); }
.map-foot b{ color:var(--wp-ok); font-size:5.2vmin; font-weight:600; }
.dot{
  width:2.6vmin; height:2.6vmin; border-radius:50%; background:var(--wp-accent);
  box-shadow:0 0 3vmin rgba(74,198,255,.9);
}
</style>
</head>
<body>

<!-- ============================ 表盘 ============================ -->
<section class="scene" id="face" data-scene="face" data-active="1">
  <div class="bg bg-face"></div>
  <div class="overlay">
    <div class="face-top">
      <div class="face-time" id="clock">10:09</div>
      <div class="face-date" id="date">周一 3 月 2 日</div>
    </div>

    <div class="face-row">
      <button class="btn-quick" data-goto="music" aria-label="打开音乐">
        <span class="ico">♪</span><span class="lbl">音乐</span>
      </button>
      <button class="btn-quick" data-goto="map" aria-label="打开导航">
        <span class="ico">➤</span><span class="lbl">导航</span>
      </button>
    </div>

    <div class="tabs">
      <button class="btn-tab" data-goto="face" data-current="1"><span class="k">◉</span>表盘</button>
      <button class="btn-tab" data-goto="music"><span class="k">♪</span>音乐</button>
      <button class="btn-tab" data-goto="map"><span class="k">➤</span>导航</button>
    </div>
  </div>
</section>

<!-- ============================ 音乐 ============================ -->
<section class="scene" id="music" data-scene="music">
  <div class="bg bg-music"></div>
  <div class="overlay">
    <div class="cover"><i></i></div>

    <div class="track">
      <div class="track-title">夜航西飞</div>
      <div class="track-artist">林 · WatchPlay Sessions</div>
    </div>

    <div class="progress"><i></i></div>

    <div class="controls">
      <button class="btn-ctl" data-ctl="prev" aria-label="上一首">⏮</button>
      <button class="btn-ctl" data-ctl="play" data-primary="1" aria-label="播放/暂停">▶</button>
      <button class="btn-ctl" data-ctl="next" aria-label="下一首">⏭</button>
    </div>

    <div class="tabs">
      <button class="btn-tab" data-goto="face"><span class="k">◉</span>表盘</button>
      <button class="btn-tab" data-goto="music" data-current="1"><span class="k">♪</span>音乐</button>
      <button class="btn-tab" data-goto="map"><span class="k">➤</span>导航</button>
    </div>
  </div>
</section>

<!-- ============================ 导航 ============================ -->
<section class="scene" id="map" data-scene="map">
  <div class="bg bg-map">
    <div class="grid"></div>
    <div class="road"></div>
    <svg class="map-route" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <!-- 路线走右侧、止于底部三键之上：圆屏会切掉四角，而按钮不能被线压过去。 -->
      <path d="M86 58 L86 48 Q86 42 80 42 L70 42"
            fill="none" stroke="#4ac6ff" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    </svg>
    <div class="me"></div>
  </div>

  <div class="overlay">
    <div class="turn-card">
      <div class="turn-arrow">↰</div>
      <div class="turn-text">
        <div class="turn-distance">280 米</div>
        <div class="turn-street">左转 · 深南大道</div>
      </div>
    </div>

    <div class="map-foot">
      <span class="dot"></span>
      <span>剩余 <b>2.4</b> 公里</span>
      <span>预计 <b>9</b> 分钟</span>
    </div>

    <div class="tabs">
      <button class="btn-tab" data-goto="face"><span class="k">◉</span>表盘</button>
      <button class="btn-tab" data-goto="music"><span class="k">♪</span>音乐</button>
      <button class="btn-tab" data-goto="map" data-current="1"><span class="k">➤</span>导航</button>
    </div>
  </div>
</section>

<script>
(function () {
  "use strict";

  var root = document.documentElement;
  var params = new URLSearchParams(location.search);

  // 预览用：真机上这两个值由手机的 WebViewRenderModule 注入（06-rendering.md §2.3 R1/R2）。
  if (params.get("shape") === "square") root.dataset.screenShape = "square";
  var inset = parseInt(params.get("inset") || "", 10);
  if (inset > 0) root.style.setProperty("--wp-safe-inset", (inset / 10) + "vmin");

  var scenes = Array.prototype.slice.call(document.querySelectorAll(".scene"));

  function current() {
    var id = (location.hash || "#face").replace("#", "");
    return document.getElementById(id) ? id : "face";
  }

  function render() {
    var id = current();
    scenes.forEach(function (scene) {
      scene.dataset.active = scene.dataset.scene === id ? "1" : "0";
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-goto]"), function (el) {
      if (el.classList.contains("btn-tab")) {
        el.dataset.current = el.dataset.goto === id ? "1" : "0";
      }
    });
  }

  function go(id) {
    if (location.hash === "#" + id) render();
    else location.hash = id;
  }

  document.addEventListener("click", function (event) {
    var target = event.target.closest("[data-goto]");
    if (target) { go(target.dataset.goto); return; }

    var control = event.target.closest("[data-ctl]");
    if (!control) return;
    var button = control;
    if (control.dataset.ctl === "play") {
      var playing = button.dataset.playing === "1";
      button.dataset.playing = playing ? "0" : "1";
      button.textContent = playing ? "▶" : "❚❚";
      // 进度条只在"播放中"推进；10 fps 的捕获看不出差别，但浏览器里自然些。
      var bar = document.querySelector("#music .progress i");
      bar.style.transition = playing ? "none" : "width 24s linear";
      bar.style.width = playing ? "38%" : "100%";
    }
  });

  window.addEventListener("hashchange", render);

  // 走时：一秒一次，远低于捕获帧率。
  function tick() {
    var now = new Date();
    var hh = String(now.getHours()).padStart(2, "0");
    var mm = String(now.getMinutes()).padStart(2, "0");
    document.getElementById("clock").textContent = hh + ":" + mm;
    document.getElementById("date").textContent =
      "周" + "日一二三四五六"[now.getDay()] + " " + (now.getMonth() + 1) + " 月 " + now.getDate() + " 日";
  }
  tick();
  setInterval(tick, 1000);

  render();
})();
</script>
</body>
</html>
